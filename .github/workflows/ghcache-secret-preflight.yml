# 关键需求：验证同仓库 Actions 是否能访问 READONLY/WRITEONLY，及读取私有 gh-cache Release 元数据。
# 待确认：两个 Secrets 是否有效、被授予 gh-cache 权限；不下载或上传私有视频。
# 后续研究：通过预检后进行 Release 视频下载、AV1 参数扫描、完整转码。
# 风险：公开工作流日志可查看；只报告状态，绝不打印令牌、API 响应或授权标头。
# 验证重点：Secret 注入、GitHub 认证、Release 读取权限；GET 成功不能证明写入权限。
name: GH Cache Credentials Preflight

on:
  push:
    branches:
      - ghcache-secret-preflight-20261024
    paths:
      - .github/workflows/ghcache-secret-preflight.yml

permissions:
  contents: read

jobs:
  preflight:
    name: Read-only private Release credential check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm READONLY is injected
        env:
          GH_TOKEN: ${{ secrets.READONLY }}
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::READONLY is missing from this job"
            exit 1
          fi
          echo "READONLY is present"

      - name: Confirm READONLY can read target private Release
        env:
          GH_TOKEN: ${{ secrets.READONLY }}
        run: |
          set -euo pipefail
          if gh api --hostname github.com \
              repos/Grinch27/gh-cache/releases/tags/test-media-20261024-liuying \
              >/dev/null 2>&1; then
            echo "READONLY can read private Release metadata"
          else
            echo "::error::READONLY cannot access target Release"
            exit 1
          fi

      - name: Confirm WRITEONLY is injected and can read target
        env:
          GH_TOKEN: ${{ secrets.WRITEONLY }}
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::WRITEONLY is missing from this job"
            exit 1
          fi
          if gh api --hostname github.com \
              repos/Grinch27/gh-cache/releases/tags/test-media-20261024-liuying \
              >/dev/null 2>&1; then
            echo "WRITEONLY present; private Release readable; write permission not tested"
          else
            echo "::error::WRITEONLY cannot access target Release"
            exit 1
          fi

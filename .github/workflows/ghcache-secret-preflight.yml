# 关键需求：独立检查 READONLY/WRITEONLY Secrets 在 Actions Job 中是否存在且能读取私有 Release。
# 待确认：Secrets 是否保存在消费仓库 ffmpeg-compiler；写权限不在本次 GET 预检中验证。
# 后续研究：认证可用后开展真实分片下载、完整性验证与 AV1 参数扫描。
# 风险：公开仓库日志可见，只显示成功/失败，不泄露私有令牌或 API 正文。
# 验证重点：两项 Secret 分别检查，避免第一个检查失败后跳过第二个。
name: GH Cache Credentials Preflight

on:
  push:
    branches:
      - ghcache-secret-preflight-20261024
    paths:
      - .github/workflows/ghcache-secret-preflight.yml

permissions:
  contents: read

jobs:
  preflight:
    name: Two-token independent checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check READONLY and WRITEONLY independently
        env:
          READ_TOKEN: ${{ secrets.READONLY }}
          WRITE_TOKEN: ${{ secrets.WRITEONLY }}
        run: |
          set -euo pipefail
          errors=0
          for role in READ WRITE; do
            if [[ "$role" == READ ]]; then
              token="$READ_TOKEN"
            else
              token="$WRITE_TOKEN"
            fi
            if [[ -z "$token" ]]; then
              echo "::error::${role}ONLY secret is NOT available to this job"
              errors=$((errors + 1))
            elif GH_TOKEN="$token" gh api --hostname github.com \
                repos/Grinch27/gh-cache/releases/tags/test-media-20261024-liuying \
                >/dev/null 2>&1; then
              echo "${role}ONLY is available and can READ private Release"
            else
              echo "::error::${role}ONLY present but cannot READ private Release"
              errors=$((errors + 1))
            fi
          done
          if (( errors > 0 )); then
            exit 1
          fi
          echo "Both tokens passed read-only checks; WRITE permission remains untested"

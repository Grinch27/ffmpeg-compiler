# 需求：按用户明确授权，将两个已整合的临时分支删除，只保留 main，预检后启动 main 参数测试。
# 待确认：仓库 GITHUB_TOKEN 的分支删除/Actions 写权限；READONLY/WRITEONLY 的实际可用性。
# 后续研究/优化：此文件是一次性迁移入口，成功后移除；编码由独立 benchmark 工作流执行。
# 风险：删除分支引用；先检查冻结 SHA 和已并入 main 的祖先关系，保留提交历史，不删标签。
# 验证：最终 refs/heads 仅为 main；Secret 只报告状态；dispatch ref 固定 main。
name: Consolidate main and check Release credentials

on:
  push:
    branches: [main]
    paths: [.github/workflows/main-only-setup.yml]
  workflow_dispatch:

permissions: write-all

defaults:
  run:
    shell: bash

jobs:
  runner-image:
    if: github.ref == 'refs/heads/main'
    name: ubuntu-latest - runner-image
    runs-on: ubuntu-latest
    outputs:
      RUNNER_IMAGE: ${{ steps.resolve-runner-image.outputs.RUNNER_IMAGE }}
    steps:
      - name: Resolve runner-image
        id: resolve-runner-image
        uses: Grinch27/github-actions/.github/actions/resolve-runner-image@main

  main-only:
    needs: runner-image
    runs-on: ${{ needs.runner-image.outputs.RUNNER_IMAGE }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@main
        with:
          persist-credentials: false

      - name: Delete incorporated temporary branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          # Only the two reviewed refs are deleted; compare confirms their history is retained.
          import json
          import os
          import subprocess
          from urllib.parse import quote
          repo = os.environ['GITHUB_REPOSITORY']
          expected = {
              'av1-gh-cache-benchmark-20261024': '6601f8bb2f62be892573efa8f28cb5fcb7a7552b',
              'ghcache-secret-preflight-20261024': 'f558e1113f342b6384e37647c82ed9ed408af838',
          }
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', path]))
          branches = api(f'repos/{repo}/branches?per_page=100')
          for branch in branches:
              name = branch['name']
              if name == 'main':
                  continue
              if expected.get(name) != branch['commit']['sha']:
                  raise SystemExit('Unexpected branch or newer branch commit; stopped before deletion')
              comparison = api(f'repos/{repo}/compare/{expected[name]}...{os.environ["GITHUB_SHA"]}')
              if comparison['status'] not in ('ahead', 'identical'):
                  raise SystemExit('Temporary branch history is not retained in main; stopped')
          for branch in branches:
              if branch['name'] == 'main':
                  continue
              subprocess.run(['gh', 'api', '--method', 'DELETE',
                              f'repos/{repo}/git/refs/heads/{quote(branch["name"], safe="")}'], check=True)
              print(f'Deleted incorporated branch: {branch["name"]}')
          remaining = api(f'repos/{repo}/branches?per_page=100')
          if [branch['name'] for branch in remaining] != ['main']:
              raise SystemExit('Repository still has branches other than main')
          print('Verified: main is the only branch')
          PY

      - name: Verify Release credentials on main
        env:
          READ_TOKEN: ${{ secrets.READONLY }}
          WRITE_TOKEN: ${{ secrets.WRITEONLY }}
        run: |
          python3 scripts/check_release_credentials.py \
            --release-url https://github.com/Grinch27/gh-cache/releases/tag/test-media-20261024-liuying

      - name: Start AV1 sample benchmark on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run gh-cache-av1-benchmark.yml \
            --repo "$GITHUB_REPOSITORY" --ref main \
            -f release_url=https://github.com/Grinch27/gh-cache/releases/tag/test-media-20261024-liuying

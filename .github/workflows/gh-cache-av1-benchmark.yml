# 需求：仅在 main 比较三处片段、CRF 24/30/36 × preset 6/8，报告回传源 Release。
# 待确认：原视频兼容性和客观指标；后续研究：主观审片及全片参数。
# 风险：有损编码和 Actions 配额；不上传原片或样本，不打印凭据及源哈希。
# 优化：复用 Release 下载/校验/上传，仅保存原片和当前短样本。
# 验证：Secret 注入、源 SHA-256、完整解码、SSIM/VMAF、报告上传大小/digest。
name: Private Release AV1 Benchmark

on:
  workflow_dispatch:
    inputs:
      release_url:
        description: "Source Release URL; benchmark reports return to the same Release"
        required: true
        default: ""
        type: string

permissions: write-all

concurrency:
  group: private-release-av1-benchmark-main
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  runner-image:
    if: github.ref == 'refs/heads/main'
    name: ubuntu-latest - runner-image
    runs-on: ubuntu-latest
    outputs:
      RUNNER_IMAGE: ${{ steps.resolve-runner-image.outputs.RUNNER_IMAGE }}
    steps:
      - name: Resolve runner-image
        id: resolve-runner-image
        uses: Grinch27/github-actions/.github/actions/resolve-runner-image@main

  benchmark:
    name: Verify Release and benchmark AV1 clips
    needs: runner-image
    runs-on: ${{ needs.runner-image.outputs.RUNNER_IMAGE }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@main
        with:
          persist-credentials: false

      - name: Verify source Release credentials
        env:
          READ_TOKEN: ${{ secrets.READONLY }}
          WRITE_TOKEN: ${{ secrets.WRITEONLY }}
          RELEASE_URL: ${{ inputs.release_url }}
        run: |
          python3 scripts/check_release_credentials.py --release-url "$RELEASE_URL"

      - name: Pull and pin FFmpeg container
        run: |
          set -euo pipefail
          docker pull docker.io/linuxserver/ffmpeg:latest
          image_id="$(docker image inspect docker.io/linuxserver/ffmpeg:latest --format '{{.Id}}')"
          printf 'FF_IMAGE_ID=%s\n' "$image_id" >> "$GITHUB_ENV"

      - name: Download, verify, benchmark and return reports
        env:
          GH_TOKEN: ${{ secrets.READONLY }}
          GH_RELEASE_WRITE_TOKEN: ${{ secrets.WRITEONLY }}
          RELEASE_URL: ${{ inputs.release_url }}
        run: |
          python3 scripts/benchmark_release_av1.py --release-url "$RELEASE_URL"

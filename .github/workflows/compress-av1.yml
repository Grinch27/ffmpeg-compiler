# 当前基线：2026-09-22；按用户要求仅保留 OneDrive 路线，参数和回传行为沿用已验证版本。
# OneDrive 路线历史已验证源码：16ca204895bca288120952fe7b8f7a20bb1f855c。
# 历史云端验收（分支简化后尚未重跑）：https://github.com/Grinch27/ffmpeg-compiler/actions/runs/35616764844（成功）。
# 基线参数：CRF=30、preset=6、编码线程=4；MP4 AV1，按源选择 8/10-bit。
# 数据路径：OneDrive ffmpeg → action 内下载/编码/解码验证 → ffmpeg-output → 回传字节校验。
# Artifact 仅备份成品及报告，保留 3 天，不作为 job 间源视频中转。
# 依赖：scripts/onedrive_batch.py、scripts/compress_av1.py 与本基线配套，文件不能单独迁移。
# 版本策略沿用现状：动态 runner、linuxserver/ffmpeg:latest、Actions @main；并非依赖版本锁定。
# 关键需求：动态 runner → action；同一 job 下载、压缩、回传 OneDrive ffmpeg-output；无 Artifact 中转。
# 待确认：最终主观画质；后续研究：HDR/字幕/非 AAC 音轨。
# 风险：公开仓库的输入与产物可能公开；Actions 时长和存储受配额限制。
# 优化：独立于 FFmpeg 编译流程；验证：下载边界、完整编码及解码、云端实跑。
name: Compress Video to AV1 MP4

on:
  workflow_dispatch:
    inputs:
      max_files:
        description: "OneDrive safety limit (1-100); fail before downloading if exceeded"
        default: "10"
        type: string
      crf:
        description: "Quality: lower is better/larger (1-40)"
        default: "30"
        type: string
      preset:
        description: "Speed: lower is slower (4-9)"
        default: "6"
        type: string

run-name: AV1 MP4 - OneDrive - CRF ${{ inputs.crf }}
permissions: write-all

defaults:
  run:
    shell: bash

jobs:
  runner-image:
    name: ubuntu-latest - runner-image
    runs-on: ubuntu-latest
    outputs:
      RUNNER_IMAGE: ${{ steps.resolve-runner-image.outputs.RUNNER_IMAGE }}
    steps:
      - name: Resolve runner-image
        id: resolve-runner-image
        uses: Grinch27/github-actions/.github/actions/resolve-runner-image@main

  action:
    name: ${{ needs.runner-image.outputs.RUNNER_IMAGE }} - linuxserver/ffmpeg:latest - action
    needs: runner-image
    runs-on: ${{ needs.runner-image.outputs.RUNNER_IMAGE }}
    steps:
      - uses: actions/checkout@main
        with:
          persist-credentials: false

      - name: Record runner environment
        env:
          RESOLVED_RUNNER: ${{ needs.runner-image.outputs.RUNNER_IMAGE }}
        run: |
          mkdir -p runtime
          {
            printf 'Runner label: %s\nImageOS: %s\nImageVersion: %s\n' \
              "$RESOLVED_RUNNER" "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
            cat /etc/os-release
            uname -a
            lscpu
          } > runtime/runner.log
          {
            printf '### Runner environment\n\n'
            head -n 3 runtime/runner.log
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Pull latest FFmpeg from Docker Hub
        run: |
          set -euo pipefail
          mkdir -p runtime
          image=docker.io/linuxserver/ffmpeg:latest
          docker pull "$image"
          image_id="$(docker image inspect "$image" --format '{{.Id}}')"
          docker image inspect "$image_id" > runtime/image.json
          printf 'FFMPEG_DOCKER_IMAGE=%s\n' "$image_id" >> "$GITHUB_ENV"
          printf 'FFMPEG_IMAGE_METADATA=runtime/image.json\n' >> "$GITHUB_ENV"
          docker run --rm --network=none --entrypoint ffmpeg "$image_id" -version > runtime/ffmpeg-version.log
          docker run --rm --network=none --entrypoint ffmpeg "$image_id" -hide_banner -encoders > runtime/encoders.log
          grep -q libsvtav1 runtime/encoders.log
          {
            printf '### Docker runtime\n\n- Requested: `%s`\n- Image ID: `%s`\n' "$image" "$image_id"
            docker image inspect "$image_id" --format 'Repo digests: {{json .RepoDigests}}'
            head -n 1 runtime/ffmpeg-version.log
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install rclone for OneDrive
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y rclone
          rclone version > runtime/rclone-version.log

      - name: Download, encode, verify and return videos to OneDrive
        env:
          ONEDRIVE_RCLONE_CONFIG: ${{ secrets.ONEDRIVE_RCLONE_CONFIG }}
          CRF: ${{ inputs.crf }}
          PRESET: ${{ inputs.preset }}
          MAX_FILES: ${{ inputs.max_files }}
        run: |
          python3 scripts/onedrive_batch.py \
            --crf "$CRF" --preset "$PRESET" --max-files "$MAX_FILES"

      - name: Upload completed OneDrive videos
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@main
        with:
          name: av1-mp4-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/*/output_av1.mp4
          if-no-files-found: warn
          compression-level: 0
          retention-days: 3

      - name: Upload reports and logs
        if: ${{ always() }}
        uses: actions/upload-artifact@main
        with:
          name: av1-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/*.json
            output/*.md
            output/*.log
            output/*/*.json
            output/*/*.md
            output/*/*.log
            runtime/*.json
            runtime/*.log
          if-no-files-found: warn
          retention-days: 3

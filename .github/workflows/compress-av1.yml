# 关键需求：动态解析最新 Ubuntu x64 runner，不使用 toolchain；action 每次拉取 Docker Hub latest 并输出 AV1 MP4。
# 待确认：最终主观画质；后续研究：HDR/字幕/非 AAC 音轨。
# 风险：公开仓库的输入与产物可能公开；Actions 时长和存储受配额限制。
# 优化：独立于 FFmpeg 编译流程；验证：下载边界、完整编码及解码、云端实跑。
name: Compress Video to AV1 MP4

on:
  workflow_dispatch:
    inputs:
      asset_id:
        description: 'Source Release asset ID in this repository'
        required: true
        type: string
      crf:
        description: 'Quality: lower is better/larger (1-40)'
        default: '30'
        type: string
      preset:
        description: 'Speed: lower is slower (4-9)'
        default: '6'
        type: string

run-name: AV1 MP4 - asset ${{ inputs.asset_id }} - CRF ${{ inputs.crf }}
permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  runner-image:
    name: ubuntu-latest - runner-image
    runs-on: ubuntu-latest
    outputs:
      RUNNER_IMAGE: ${{ steps.resolve-runner-image.outputs.RUNNER_IMAGE }}
    steps:
      - name: Resolve runner-image
        id: resolve-runner-image
        uses: Grinch27/github-actions/.github/actions/resolve-runner-image@main

  action:
    name: ${{ needs.runner-image.outputs.RUNNER_IMAGE }} - linuxserver/ffmpeg:latest - action
    needs: runner-image
    runs-on: ${{ needs.runner-image.outputs.RUNNER_IMAGE }}
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record runner environment
        env:
          RESOLVED_RUNNER: ${{ needs.runner-image.outputs.RUNNER_IMAGE }}
        run: |
          mkdir -p runtime
          {
            printf 'Runner label: %s\nImageOS: %s\nImageVersion: %s\n' \
              "$RESOLVED_RUNNER" "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
            cat /etc/os-release
            uname -a
            lscpu
          } > runtime/runner.log
          {
            printf '### Runner environment\n\n'
            head -n 3 runtime/runner.log
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Pull latest FFmpeg from Docker Hub
        timeout-minutes: 15
        run: |
          set -euo pipefail
          mkdir -p runtime
          image=docker.io/linuxserver/ffmpeg:latest
          docker pull "$image"
          image_id="$(docker image inspect "$image" --format '{{.Id}}')"
          docker image inspect "$image_id" > runtime/image.json
          printf 'FFMPEG_DOCKER_IMAGE=%s\n' "$image_id" >> "$GITHUB_ENV"
          printf 'FFMPEG_IMAGE_METADATA=runtime/image.json\n' >> "$GITHUB_ENV"
          docker run --rm --network=none --entrypoint ffmpeg "$image_id" -version > runtime/ffmpeg-version.log
          docker run --rm --network=none --entrypoint ffmpeg "$image_id" -hide_banner -encoders > runtime/encoders.log
          grep -q libsvtav1 runtime/encoders.log
          {
            printf '### Docker runtime\n\n- Requested: `%s`\n- Image ID: `%s`\n' "$image" "$image_id"
            docker image inspect "$image_id" --format 'Repo digests: {{json .RepoDigests}}'
            head -n 1 runtime/ffmpeg-version.log
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Download Release asset
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_ID: ${{ inputs.asset_id }}
        run: |
          set -euo pipefail
          [[ "$ASSET_ID" =~ ^[0-9]+$ ]] || { echo 'Invalid asset ID'; exit 1; }
          mkdir -p input
          gh api "repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}" > input/asset.json
          python3 - <<'PY'
          import json, shutil
          asset = json.load(open('input/asset.json'))
          size = asset['size']
          if not 0 < size < 2 * 1024**3:
              raise SystemExit('Input must be nonempty and smaller than 2 GiB')
          if shutil.disk_usage('.').free < size * 4:
              raise SystemExit('Insufficient free disk space')
          PY
          gh api -H 'Accept: application/octet-stream' \
            "repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}" > input/source.mp4
          python3 - <<'PY'
          import hashlib, json, pathlib
          asset = json.load(open('input/asset.json'))
          source = pathlib.Path('input/source.mp4')
          if source.stat().st_size != asset['size']:
              raise SystemExit('Downloaded size mismatch')
          digest = asset.get('digest')
          if digest and digest.startswith('sha256:'):
              with source.open('rb') as stream:
                  actual = 'sha256:' + hashlib.file_digest(stream, 'sha256').hexdigest()
              if actual != digest:
                  raise SystemExit('Downloaded SHA-256 mismatch')
          PY
      - name: Encode and verify
        timeout-minutes: 310
        env:
          CRF: ${{ inputs.crf }}
          PRESET: ${{ inputs.preset }}
        run: |
          python3 scripts/compress_av1.py input/source.mp4 \
            --output-dir output --crf "$CRF" --preset "$PRESET" --threads 4
      - name: Upload completed video
        uses: actions/upload-artifact@v4
        with:
          name: av1-mp4-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/output_av1.mp4
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
      - name: Upload reports and logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: av1-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/*.json
            output/*.md
            output/*.log
            runtime/*.json
            runtime/*.log
          if-no-files-found: warn
          retention-days: 3

# 需求：仅压缩原始视频开头的 1200 个解码视频帧，回传单组编码成品和完整 FFmpeg/SVT-AV1 日志。
# 待确认：媒体时间戳及音轨同步；后续研究：结合 encode.log/progress.log 和主观画质决策参数。
# 优化：共用预检、runner 与镜像获取；不安装 rclone，不用 Artifact 中转。
# 风险：有损编码和运行配额；失败可能留下本次已上传附件，不覆盖或删除原附件。
# 验证：分片/原文件 SHA-256、完整解码、上传附件大小/digest；静态测试不替代云端实跑。
name: Release AV1 First 1200 Frames Compression

# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
on:
  workflow_dispatch:
    inputs:
      release_url:
        description: "Source Release URL; results return to the same Release"
        required: true
        default: ""
        type: string
      crf:
        description: "First 1200-frame CRF (1-40)"
        default: "30"
        type: string
      preset:
        description: "First 1200-frame encoder preset (4-9)"
        default: "6"
        type: string

run-name: Release AV1 first1200 - CRF ${{ inputs.crf || '30' }} - preset ${{ inputs.preset || '6' }}
permissions: write-all

concurrency:
  group: release-av1-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  runner-image:
    if: github.ref == 'refs/heads/main'
    name: ubuntu-latest - runner-image
    runs-on: ubuntu-latest
    outputs:
      RUNNER_IMAGE: ${{ steps.resolve-runner-image.outputs.RUNNER_IMAGE }}
    steps:
      - name: Resolve runner-image
        id: resolve-runner-image
        uses: Grinch27/github-actions/.github/actions/resolve-runner-image@main

  action:
    name: ${{ needs.runner-image.outputs.RUNNER_IMAGE }} - Release AV1
    needs: runner-image
    runs-on: ${{ needs.runner-image.outputs.RUNNER_IMAGE }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@main
        with:
          persist-credentials: false

      - name: Check Release credentials
        env:
          READ_TOKEN: ${{ secrets.READONLY }}
          WRITE_TOKEN: ${{ secrets.WRITEONLY }}
          RELEASE_URL: ${{ inputs.release_url }}
        run: |
          python3 scripts/check_release_credentials.py --release-url "$RELEASE_URL"

      - name: Pull FFmpeg
        run: |
          set -euo pipefail
          mkdir -p runtime
          docker pull docker.io/linuxserver/ffmpeg:latest
          image_id="$(docker image inspect docker.io/linuxserver/ffmpeg:latest --format '{{.Id}}')"
          docker image inspect "$image_id" > runtime/image.json
          printf 'FFMPEG_DOCKER_IMAGE=%s\n' "$image_id" >> "$GITHUB_ENV"
          printf 'FFMPEG_IMAGE_METADATA=runtime/image.json\n' >> "$GITHUB_ENV"
          printf 'FF_IMAGE_ID=%s\n' "$image_id" >> "$GITHUB_ENV"

      - name: Process video and return verified results to source Release
        timeout-minutes: 170
        env:
          GH_TOKEN: ${{ secrets.READONLY }}
          GH_RELEASE_WRITE_TOKEN: ${{ secrets.WRITEONLY }}
          RELEASE_URL: ${{ inputs.release_url }}
          CRF: ${{ inputs.crf }}
          PRESET: ${{ inputs.preset }}
        run: |
          python3 scripts/release_av1.py \
            --release-url "$RELEASE_URL" --crf "$CRF" --preset "$PRESET" --max-frames 1200
